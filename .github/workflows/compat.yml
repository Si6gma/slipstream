name: Version compatibility

# The jar claims 26.1 through 26.3, but CI only ever built the one version pinned in
# gradle.properties. The entire physics surface is a single @Inject at the TAIL of
# LivingEntity.travel with defaultRequire 1, so the day Mojang splits that method, anyone on a
# snapshot tracking pack gets a hard crash at launch and nothing here would have noticed.
#
# What this catches: API drift, and a mixin target that no longer resolves at compile time.
#
# What it does NOT catch: a mixin that compiles but fails to apply, because mixins apply at
# runtime. Closing that needs a headless launch or a gametest per version, which is the remaining
# half of roadmap item 11.
#
# Only 26.2 and 26.3 are listed, because those are the two whose dependency sets are known good.
# supported_minecraft_versions also claims 26.1, 26.1.1 and 26.1.2; add them here once their
# Fabric API and Cloth Config versions are pinned down, rather than guessing and shipping a
# permanently red job.

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      # Every version reports, rather than stopping at the first red: knowing that 26.2 broke and
      # 26.3 did not is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            loader: '0.19.3'
            fabric_api: '0.160.0+26.2'
            cloth: '26.2.155'
            modmenu: '20.0.2'
          - minecraft: '26.3'
            loader: '0.19.5'
            fabric_api: '0.161.0+26.3'
            cloth: '26.3.158'
            modmenu: '21.0.0-beta.1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Loom artifacts
        uses: actions/cache@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ matrix.minecraft }}-${{ hashFiles('gradle.properties') }}
          restore-keys: loom-${{ matrix.minecraft }}-

      # The Paper module is deliberately not overridden: it depends on paper-api, not on the
      # Minecraft version being built for Fabric, so it is the same build every time round.
      - name: Build against ${{ matrix.minecraft }}
        run: |
          ./gradlew build \
            -Pminecraft_version=${{ matrix.minecraft }} \
            -Ploader_version=${{ matrix.loader }} \
            -Pfabric_api_version=${{ matrix.fabric_api }} \
            -Pcloth_config_version=${{ matrix.cloth }} \
            -Pmodmenu_version=${{ matrix.modmenu }}
