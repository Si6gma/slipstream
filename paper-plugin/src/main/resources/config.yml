#
# Slipstream Paper Plugin Config
#
# These values are pushed to every connecting Fabric client
# and override their local config for the duration of the session.
# Players revert to their own settings when they disconnect.
#
# Set override-clients to false to let players use their own
# local config (particles will still use the values below).
#

override-clients: true

# Set to false to temporarily disable the ground effect for all players.
# Persists across restarts.
effect-enabled: true

# Worlds where ground effect particles and client override are disabled.
# Use the exact world folder name (e.g. world_nether, world_the_end).
disabled-worlds: []

# Blocks above the surface where the speed boost and particles activate.
effect-height: 20.0

# Speed added per tick at maximum ground proximity (client boost only).
acceleration: 0.005

# Hard speed ceiling for the boost in blocks/tick (client boost only).
# Vanilla elytra with a firework tops out around 1.5.
max-speed: 1.5

# Set to false to disable all ground effect particles server-wide.
particles-enabled: true

# Blocks above water where spray particles appear.
water-spray-height: 5.0

# Upward lift force when skimming near the surface (client boost only).
lift-strength: 0.6

# Fraction of max-speed (0.0-1.0) required before lift and vortex particles activate.
# Vanilla elytra cruises around 0.6 bpt; with max-speed=1.5, a threshold of 0.3
# means the effect starts at 0.45 bpt, below cruise speed so lift stays active
# even when the player decelerates slightly by leveling out, but high enough
# that it won't trigger at near-standstill glide speeds.
effect-speed-threshold: 0.3

#
# Lunar Client integration (optional)
#
# Requires the Apollo plugin. Without it this whole section is ignored and
# nothing changes for anyone. Players not on Lunar Client are unaffected
# either way; they still get the normal particles.
#
apollo:
  # Master switch. Changing this takes a restart, since the hook is wired up
  # when the plugin enables. Everything below reloads with /slipstream reload.
  enabled: true

  notification:
    # One time toast the first time a player ever triggers the ground effect.
    # Who has seen it is stored in plugins/Slipstream/lunar-seen.txt; delete
    # that file to show it to everyone again.
    enabled: true

  mod-settings:
    # Turns on Lunar's FOV mod with dynamic flying FOV, so acceleration
    # actually reads as speed on screen.
    #
    # Off by default: this overrides a client setting the player chose for
    # themselves. Apollo scopes the override to the session, so their own
    # settings come back when they disconnect.
    enabled: false

    # Strength of the FOV change while flying. 1.0 is no change.
    flying-fov-modifier: 1.2
