name: Slipstream
version: '${version}'
main: com.si6gma.slipstream.paper.SlipstreamPlugin
api-version: '1.21'
description: Serverside particles for the Slipstream Fabric mod.
authors: [Si6gma]
website: https://modrinth.com/mod/slipstream
# Apollo registers itself as Apollo-Bukkit on Paper/Spigot and Apollo-Folia on Folia.
# Neither is required; without them the Lunar Client feedback simply stays off.
softdepend: [Apollo-Bukkit, Apollo-Folia]

commands:
  slipstream:
    description: Slipstream admin commands.
    usage: /slipstream <enable|disable|reload>
    permission: slipstream.admin

permissions:
  slipstream.admin:
    description: Access to /slipstream admin commands.
    default: op
